<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصة تعلم العربية </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- ربط Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://mresinrhhzmrialcqjyr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_R92kgFxPudlmAsiDYu2vow_3CLortUp';
  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );
</script>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <img src="assets/Arabic_logo.png" alt="شعار البرنامج">
    <div class="brand-div"></div>
    <img src="assets/logo-saqifah.png" alt="شعار السقيفة">
    <div class="brand-text">
      <b>منصة تعلم العربية </b>
      <span>برنامج تعلم العربية &middot; السقيفة</span>
    </div>
  </div>
  <div class="header-actions" id="headerActions"></div>
</header>

<!-- شاشة تسجيل الدخول -->
<!-- ملاحظة: الإدارة تسجل الدخول ببريد وكلمة مرور Supabase Auth كالسابق.
     المعلم/ـة يسجل الدخول اختيار اسمه من القائمة + كود الدخول الذي تعطيه له
     الإدارة من لوحة "المعلمون" (بدون حاجة لبريد إلكتروني أو Supabase Auth). -->
<section id="screen-role" class="screen active">
  <div class="login-shell">
    <div class="login-box">
      <h2>تسجيل الدخول</h2>
      <p class="lead">اختر دخولك كإدارة أو كمعلم/ـة.</p>

      <div class="login-section">
        <label>الإدارة</label>
        <div class="field">
          <input type="email" id="adminEmailInput" placeholder="البريد الإلكتروني" autocomplete="username">
        </div>
        <div class="field">
          <input type="password" id="adminPwInput" placeholder="كلمة المرور" autocomplete="current-password">
        </div>
        <button class="btn primary block" onclick="adminLogin()">دخول لوحة الإدارة</button>
        <div id="adminHint" class="hint">استخدم البريد الإلكتروني وكلمة المرور الخاصة بحساب الإدارة.</div>
      </div>

      <hr>

      <div class="login-section">
        <label>المعلم/ـة</label>
        <div class="field">
          <select id="teacherSelect"><option value="">جاري تحميل الأسماء...</option></select>
        </div>
        <div class="field">
          <input type="text" id="teacherCodeInput" placeholder="كود الدخول (مثال: X7I12)">
        </div>
        <button class="btn secondary block" onclick="teacherCodeLogin()">دخول المعلم/ـة</button>
        <div class="hint">استخدم اسمك وكود الدخول الذي أعطتك إياه الإدارة.</div>
      </div>
    </div>
  </div>
</section>

<!-- لوحة الإدارة -->
<section id="screen-admin" class="screen">
  <div class="layout">
    <nav class="sidebar" id="adminNav"></nav>
    <div class="main-panel" id="adminMain"></div>
  </div>
</section>

<!-- لوحة المعلم -->
<section id="screen-teacher" class="screen">
  <div class="layout">
    <nav class="sidebar" id="teacherNav"></nav>
    <div class="main-panel" id="teacherMain"></div>
  </div>
</section>

<div class="toast-wrap" id="toastWrap"></div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</body>
</html>
