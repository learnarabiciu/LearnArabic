<!-- شاشة تسجيل الدخول -->
<!-- ملاحظة: الإدارة تسجل الدخول ببريد وكلمة مرور Supabase Auth كالسابق.
     المعلم/ـة يسجل الدخول اختيار اسمه من القائمة + كود الدخول الذي تعطيه له
     الإدارة من لوحة "المعلمون" (بدون حاجة لبريد إلكتروني أو Supabase Auth). -->
<section id="screen-role" class="screen active">
  <div class="login-shell">
    <div class="login-box tabs-on" id="loginBox">
      <h2>تسجيل الدخول</h2>
      <p class="lead">اختر نوع الدخول ثم أدخل بياناتك.</p>

      <div class="login-tabs" id="loginTabs">
        <button type="button" data-role="ceo" onclick="setLoginRole('ceo')"><span class="ceo-dot"></span> الرئيس التنفيذي</button>
        <button type="button" data-role="admin" onclick="setLoginRole('admin')">الإدارة</button>
        <button type="button" data-role="teacher" onclick="setLoginRole('teacher')">المعلم/ـة</button>
        <button type="button" data-role="employee" onclick="setLoginRole('employee')">الموظف/ـة</button>
      </div>

      <div class="login-section login-pane" data-pane="ceo">
        <label>الرئيس التنفيذي</label>
        <div class="field">
          <input type="password" id="ceoCodeInput" placeholder="كود الدخول" autocomplete="off">
        </div>
        <button class="btn primary block" onclick="ceoCodeLogin()">دخول الرئيس التنفيذي</button>
      </div>

      <div class="login-section login-pane" data-pane="admin">
        <label>الإدارة</label>
        <div class="field">
          <input type="email" id="adminEmailInput" placeholder="البريد الإلكتروني" autocomplete="username">
        </div>
        <div class="field">
          <input type="password" id="adminPwInput" placeholder="كلمة المرور" autocomplete="current-password">
        </div>
        <button class="btn primary block" onclick="adminLogin()">دخول لوحة الإدارة</button>
        <div id="adminHint" class="hint">استخدم البريد الإلكتروني وكلمة المرور الخاصة بحساب الإدارة.</div>
      </div>

      <div class="login-section login-pane" data-pane="teacher">
        <label>المعلم/ـة</label>
        <div class="field">
          <select id="teacherSelect"><option value="">جاري تحميل الأسماء...</option></select>
        </div>
        <div class="field">
          <input type="text" id="teacherCodeInput" placeholder="كود الدخول (مثال: X7I12)">
        </div>
        <button class="btn secondary block" onclick="teacherCodeLogin()">دخول المعلم/ـة</button>
        <div class="hint">استخدم اسمك وكود الدخول الذي أعطتك إياه الإدارة.</div>
      </div>

      <div class="login-section login-pane" data-pane="employee">
        <label>الموظف/ـة</label>
        <div class="field">
          <select id="employeeSelect"><option value="">جاري تحميل الأسماء...</option></select>
        </div>
        <div class="field">
          <input type="text" id="employeeCodeInput" placeholder="كود الدخول (مثال: K4M92)">
        </div>
        <button class="btn ghost block" onclick="employeeCodeLogin()">دخول الموظف/ـة</button>
        <div class="hint">استخدم اسمك وكود الدخول الذي أعطتك إياه الإدارة.</div>
      </div>

      <div class="install-box" id="installBox" hidden>
        <button type="button" class="btn ghost block" id="installBtn">📲 تثبيت الموقع كتطبيق على جوالك</button>
        <div class="hint" id="installHint"></div>
      </div>
    </div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* تبويبات الدخول: يتذكّر آخر نوع دخول استخدمته */
function setLoginRole(role){
  const box=document.getElementById('loginBox');
  if(!box) return;
  box.querySelectorAll('.login-pane').forEach(p=>{
    p.hidden = p.dataset.pane!==role;
  });
  box.querySelectorAll('#loginTabs button').forEach(b=>{
    b.classList.toggle('active', b.dataset.role===role);
  });
  try{ localStorage.setItem('saqifah:loginRole',role); }catch{}
}
(function(){
  let r='teacher';
  try{ r=localStorage.getItem('saqifah:loginRole')||'teacher'; }catch{}
  if(!['ceo','admin','teacher','employee'].includes(r)) r='teacher';
  setLoginRole(r);
})();

/* تثبيت الموقع كتطبيق (PWA) */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredInstall=e;
  document.getElementById('installBox').hidden=false;
});
document.getElementById('installBtn')?.addEventListener('click',async()=>{
  if(!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall=null;
  document.getElementById('installBox').hidden=true;
});
(function(){
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(isIOS && !standalone){
    document.getElementById('installBox').hidden=false;
    document.getElementById('installBtn').style.display='none';
    document.getElementById('installHint').textContent=
      'لتثبيته على الآيفون: اضغط زر المشاركة في سفاري ثم "إضافة إلى الشاشة الرئيسية".';
  }
})();
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
